<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь | Школа №157</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    
    <!-- Общие стили -->
    <link rel="stylesheet" href="css/style4.css">
</head>

<body class="form-page">

<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="form-card">

                <div class="form-header">
                    <span class="glyphicon glyphicon-envelope"></span>
                    <h2>Свяжитесь с нами</h2>
                    <p>Мы всегда рады помочь</p>
                </div>

                <!-- ФОРМА -->
                <form id="feedbackForm">

                    <!-- Имя -->
                    <div class="form-group required-field">
                        <label for="name">Ваше имя</label>
                        <div class="input-group">
                            <span class="input-group-addon">
                                <span class="glyphicon glyphicon-user"></span>
                            </span>
                            <input type="text" class="form-control" id="name" placeholder="Введите ваше имя">
                        </div>
                        <div class="error-text" id="nameError"></div>
                    </div>

                    <!-- Email -->
                    <div class="form-group required-field">
                        <label for="email">Email</label>
                        <div class="input-group">
                            <span class="input-group-addon">
                                <span class="glyphicon glyphicon-envelope"></span>
                            </span>
                            <input type="email" class="form-control" id="email" placeholder="example@mail.ru">
                        </div>
                        <div class="error-text" id="emailError"></div>
                    </div>

                    <!-- Телефон -->
                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <div class="input-group">
                            <span class="input-group-addon">
                                <span class="glyphicon glyphicon-phone"></span>
                            </span>
                            <input type="tel" class="form-control" id="phone" placeholder="+7 (999) 123-45-67">
                        </div>
                    </div>

                    <!-- Тема -->
                    <div class="form-group">
                        <label>Тема обращения</label>
                        <div class="btn-group" data-toggle="buttons">
                            <label class="btn">
                                <input type="radio" name="type" checked> 
                                <span class="glyphicon glyphicon-question-sign"></span> Вопрос
                            </label>
                            <label class="btn">
                                <input type="radio" name="type"> 
                                <span class="glyphicon glyphicon-exclamation-sign"></span> Проблема
                            </label>
                            <label class="btn">
                                <input type="radio" name="type"> 
                                <span class="glyphicon glyphicon-bullhorn"></span> Идея
                            </label>
                        </div>
                    </div>

                    <!-- Сообщение -->
                    <div class="form-group required-field">
                        <label for="message">Сообщение</label>
                        <div class="input-group">
                            <span class="input-group-addon">
                                <span class="glyphicon glyphicon-pencil"></span>
                            </span>
                            <textarea class="form-control" id="message" placeholder="Ваше сообщение..."></textarea>
                        </div>
                        <div class="error-text" id="messageError"></div>
                    </div>

                    <!-- Чекбокс -->
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" id="agree"> 
                            <span class="glyphicon glyphicon-lock"></span> Согласие на обработку
                        </label>
                    </div>

                    <!-- Кнопки -->
                    <div class="action-buttons">
                        <button type="submit" class="btn btn-default" id="submitBtn">
                            <span class="glyphicon glyphicon-send"></span> Отправить
                        </button>
                        <button type="reset" class="btn btn-default">
                            <span class="glyphicon glyphicon-refresh"></span> Очистить
                        </button>
                    </div>

                </form>

                <!-- Контакты -->
                <div class="contact-info">
                    <p><span class="glyphicon glyphicon-earphone"></span> +7 (777) 777-77-77</p>
                    <p><span class="glyphicon glyphicon-time"></span> Пн-Пт 9:00 - 18:00</p>
                </div>

                <!-- Назад -->
                <a href="index4.html" class="back-link">
                    <span class="glyphicon glyphicon-arrow-left"></span> Вернуться на главную
                </a>

            </div>
        </div>
    </div>
</div>


<!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- JS -->
<script src="js/form.js"></script>

</body>
</html>
